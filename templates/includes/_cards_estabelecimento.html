<!-- Cards para listagem geral de Estabelecimentos da Saúde-->
 <div class="vt-card-grid">
    {% for unidade in unidades %}
    <a href="{% url url_unidade unidade.slug %}" class="vt-card-unit" title="Acessar {{ unidade.nome }}">
        
        <div class="vt-card-unit__header">
            <div class="vt-card-unit__icon">
                <i class="bi bi-pin-map-fill"></i>
            </div>
            <div>
                <h2 class="vt-card-unit__title">{{ unidade.nome }}</h2>
                <p class="vt-card-unit__subtitle">{{ unidade.cnes|default:"Não informado" }}</p>
            </div>
        </div>

        <div class="vt-card-unit__info">
            <div class="vt-card-unit__info-item">
                <i class="bi bi-envelope-at vt-card-unit__info-icon"></i>
                <span class="text-truncate">{{ unidade.email|default:"Não informado" }}</span>
            </div>
        </div>

    </a>
    {% empty %}
    <div class="col-12 text-center text-muted mt-5" style="grid-column: 1 / -1;">
        <i class="bi bi-inboxes fs-1 mb-3 d-block"></i>
        <p>{{ msg_vazio }}</p>
    </div>
    {% endfor %}
</div>
