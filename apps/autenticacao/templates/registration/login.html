{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso ao sistema Vitalin - Gestão Inteligente em Saúde">
  <title>Login | VITALIN</title>
  
  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Icons Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- CSS do projeto -->
  <link rel="stylesheet" href="{% static 'styles/base.css' %}">
  <link rel="stylesheet" href="{% static 'styles/auth.css' %}">
</head>
<body class="vt-auth-body">
  
  <div class="vt-auth-container">
    <div class="vt-auth-card">
      
      <!-- Marca Vitalin -->
      <div class="vt-auth-brand">
        <!-- Substitua pelo caminho real da logo se necessário -->
        <img src="{% static 'img/logo.png' %}" alt="Logo Vitalin">
        <h1>VITALIN</h1>
        <p>Gestão Inteligente em Reabilitação para Rede</p>
        <p class="vt-auth-date text-muted mt-2 mb-0">Campinas-SP, {% now "d \d\e F \d\e Y" %}</p>
      </div>    

      <!-- Formulário -->
      <form class="vt-auth-form" method="post" action="{% url 'autenticacao:login' %}">
        {% csrf_token %}
        
        <!-- Mensagens de Erro do Login -->
        {% if form.non_field_errors %}
          <div class="alert alert-danger vt-auth-alert" role="alert">
            {% for error in form.non_field_errors %}
              {{ error }}
            {% endfor %}
          </div>
        {% endif %}

        <div class="mb-4">
          <label for="id_username" class="form-label">Usuário</label>
          <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Digite seu usuário">
        </div>

        <div class="mb-4">
          <label for="id_password" class="form-label">Senha</label>
          <input type="password" name="password" class="form-control" id="id_password" required placeholder="Digite sua senha">
        </div>

        <button type="submit" class="vt-auth-btn">
          ENTRAR <i class="bi bi-arrow-right-short fs-5"></i>
        </button>
      </form>

      <!-- Links Adicionais -->
      <div class="vt-auth-footer">
        <a href="#"><i class="bi bi-shield-lock me-1"></i> Esqueceu sua senha?</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
